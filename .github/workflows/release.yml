name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-tools-dev build-essential cmake ninja-build libgl1-mesa-dev

      - name: Configure CMake
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package (DEB)
        run: |
          cd build
          cpack -G DEB

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          files: build/*.deb
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APT Repo to GitHub Pages
        run: |
          # Install repo tools
          sudo apt-get install -y dpkg-dev

          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stash the built deb file
          mkdir -p /tmp/debs
          cp build/*.deb /tmp/debs/

          # Checkout or create gh-pages branch
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf .
          fi

          # Copy new deb file
          cp /tmp/debs/*.deb .

          # Scan packages to create APT index
          dpkg-scanpackages --multiversion . > Packages
          gzip -k -f Packages
          apt-ftparchive release . > Release

          # Commit and Push
          git add .
          git commit -m "Update APT repository with $(basename /tmp/debs/*.deb)"
          git push origin gh-pages --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
